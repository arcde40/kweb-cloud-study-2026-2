# Week 3 — 지난주 미션 3을 파일 하나로
#   cp .env.example .env   (PORT를 내 포트로)
#   docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # "준비 완료"의 정의: Postgres가 TCP로 접속을 받는가
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DB_HOST: db                       # 서비스 이름 = DNS 이름
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy      # 미션 2: 이 두 줄을 "- db" 로 바꿔 보세요

volumes:
  pgdata:
