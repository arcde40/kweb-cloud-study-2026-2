# nginx는 시작할 때 "app"의 IP를 전부 받아 두고, 요청을 돌아가며 나눠 줍니다.
# 레플리카 수를 바꾸면? nginx를 다시 시작해야 새 IP를 압니다 (docker compose restart lb)
# → 이걸 자동으로 해 주는 게 쿠버네티스 Service (W5)
upstream app_servers {
    zone app_servers 64k;
    server app:3000;
}

server {
    listen 80;
    location / {
        proxy_pass http://app_servers;
    }
}
