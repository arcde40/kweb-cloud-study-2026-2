# 밖에서 들어오는 문: "이 호스트 이름으로 오면 app Service로"
#   kweb-www 를 kweb-<내 아이디>로 바꾸고 apply  (sed -i "s/kweb-www/kweb-$USER/" ingress.yaml)
#   남의 아이디로는 만들 수 없습니다 (클러스터 정책)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  ingressClassName: traefik
  rules:
    - host: kweb-www.fjey.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
